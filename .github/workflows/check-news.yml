name: Revisar noticias de inversión

on:
  schedule:
    # Cada 30 minutos. Ajusta esta expresión cron si quieres otra frecuencia.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm install

      - name: Diagnóstico: listar tablas visibles por la API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" > /tmp/openapi.json
          echo "=== Tablas/rutas visibles por PostgREST ===" > /tmp/diag.log
          python3 -c "
import json
with open('/tmp/openapi.json') as f:
    data = json.load(f)
paths = list(data.get('paths', {}).keys())
print('Tablas/rutas visibles:', paths)
" >> /tmp/diag.log
          echo "=== SUPABASE_URL usada ===" >> /tmp/diag.log
          echo "$SUPABASE_URL" >> /tmp/diag.log

      - name: Ejecutar revisión de noticias
        id: run_check
        working-directory: backend
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: npm run check > /tmp/run_output.log 2>&1

      - name: Reportar fallo como issue (temporal, para depurar)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat /tmp/diag.log /tmp/run_output.log > /tmp/combined.log 2>/dev/null || cat /tmp/diag.log > /tmp/combined.log
          BODY=$(cat /tmp/combined.log | tail -c 60000 | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{\"title\":\"[debug] fallo v3 $(date -u +%FT%TZ)\",\"body\":$BODY}"

      - name: Fallar el job si el script falló
        if: steps.run_check.outcome == 'failure'
        run: exit 1
